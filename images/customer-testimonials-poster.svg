<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 720" width="1280" height="720" role="img" aria-label="המלצות לקוחות iTeam">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#001F3F"/>
      <stop offset="1" stop-color="#003366"/>
    </linearGradient>
    <radialGradient id="glow" cx="50%" cy="40%" r="55%">
      <stop offset="0" stop-color="#0D9488" stop-opacity="0.30"/>
      <stop offset="1" stop-color="#0D9488" stop-opacity="0"/>
    </radialGradient>
    <pattern id="grid" width="40" height="40" patternUnits="userSpaceOnUse">
      <path d="M40 0H0V40" fill="none" stroke="#ffffff" stroke-opacity="0.05" stroke-width="1"/>
    </pattern>
    <filter id="shadow" x="-50%" y="-50%" width="200%" height="200%">
      <feDropShadow dx="0" dy="10" stdDeviation="20" flood-color="#000000" flood-opacity="0.35"/>
    </filter>
  </defs>

  <rect width="1280" height="720" fill="url(#bg)"/>
  <rect width="1280" height="720" fill="url(#grid)"/>
  <rect width="1280" height="720" fill="url(#glow)"/>

  <!-- play button -->
  <g filter="url(#shadow)">
    <circle cx="640" cy="300" r="86" fill="#ffffff" fill-opacity="0.12"/>
    <circle cx="640" cy="300" r="66" fill="#0D9488"/>
    <path d="M620 262 L688 300 L620 338 Z" fill="#ffffff"/>
  </g>

  <!-- text -->
  <text x="640" y="452" text-anchor="middle" direction="rtl"
        font-family="Heebo, Arial, sans-serif" font-size="54" font-weight="700" fill="#ffffff">המלצות לקוחות</text>
  <text x="640" y="502" text-anchor="middle" direction="rtl"
        font-family="Heebo, Arial, sans-serif" font-size="27" font-weight="400" fill="#ffffff" fill-opacity="0.72">לקוחות iTeam מספרים על העבודה איתנו</text>
</svg>
